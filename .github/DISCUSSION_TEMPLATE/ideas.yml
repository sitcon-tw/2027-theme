title: ""
body:
  - type: markdown
    attributes:
      value: |
        這裡用來分享任何你覺得 **SITCON 2027 值得一起討論的觀察、問題或主題方向**。

        不需要先想好年會主題名稱，也不需要是一份完整提案。尚未想清楚的地方，也可以直接寫出來讓其他人接續。

  - type: textarea
    id: idea
    attributes:
      label: 你在想什麼？
      description: 說明你觀察到的現象、問題、張力或想法。可以很不完整。
      placeholder: |
        最近我一直在想……
        我注意到……
        我還不確定這是不是一個主題，但……
    validations:
      required: true

  - type: textarea
    id: why-sitcon
    attributes:
      label: 為什麼覺得值得 SITCON 討論？
      description: 可以從學生、資訊科技、社群、學習、實作或你認為重要的其他角度回答。不確定也可以留白。
      placeholder: 我覺得這和 SITCON 有關，是因為……
    validations:
      required: false

  - type: textarea
    id: connections
    attributes:
      label: 有哪些延伸素材或相關討論？
      description: 可以放其他 Discussion、文章、影片、作品、關鍵字，或指出你覺得可以一起思考的其他想法。
      placeholder: |
        #12 可能也在談類似的事情
        關鍵字：……
        參考資料：……
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **討論方式**

        - 原始貼文可以補充，但如果想法產生明顯轉折或分支，建議用回覆或另開一篇 Discussion，並連回原討論。
        - 不同提案可以彼此延伸、拆分或重新組合；整理時會盡量保留來源與不同觀點。
        - 這裡的目的不是比哪個提案最完整，而是讓一個人的想法更容易被另一個人接下去。
