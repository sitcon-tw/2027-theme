title: ""
body:
  - type: markdown
    attributes:
      value: |
        當一個想法已經逐漸形成「可以怎麼看今年 SITCON」的方向時，可以使用這份模板。

        這仍然不是定稿。名稱、論述與範圍都可以在討論中繼續改變。

  - type: textarea
    id: proposition
    attributes:
      label: 用一句話說明這個方向
      description: 先說核心命題即可，不必先有正式主題名稱。
      placeholder: 這個方向想討論的是……
    validations:
      required: true

  - type: textarea
    id: tension
    attributes:
      label: 它想處理什麼問題或張力？
      description: 與其只列關鍵字，更希望知道哪些事情正在彼此拉扯、改變，或值得被重新理解。
      placeholder: |
        一方面……
        另一方面……
        我們想追問的是……
    validations:
      required: true

  - type: textarea
    id: timing
    attributes:
      label: 為什麼是現在？為什麼是 SITCON？
      description: 說明它和當下、學生、資訊科技、社群或 SITCON 的關聯。尚未完整也沒關係。
    validations:
      required: false

  - type: textarea
    id: sources
    attributes:
      label: 這個方向從哪些討論發展而來？
      description: 請盡量連結相關 Discussion，讓後來的人能看見它如何形成。
      placeholder: |
        延伸自 #12、#18……
        其中 #18 比較著重……，這裡則想把問題往……發展。
    validations:
      required: false

  - type: textarea
    id: possibilities
    attributes:
      label: 如果成為年會主題，它可能帶出什麼？
      description: 不必全部回答；可想到什麼就寫什麼，例如 Keynote、論壇問題、徵稿方向、視覺或會眾體驗。
      placeholder: |
        可能的論壇問題：……
        可能邀請的觀點：……
        可能的視覺意象：……
    validations:
      required: false

  - type: textarea
    id: uncertainties
    attributes:
      label: 還沒想清楚、擔心或可能被誤解的地方
      description: 把弱點寫出來是討論的一部分，不會降低提案價值。
      placeholder: 我目前最不確定的是……
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        這份提案可以被其他人延伸、拆分或重新組合。若後續形成明顯不同的版本，建議另開 Discussion 並連回這篇，以保留演進脈絡。
